apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: package-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/shresth-kumar-lal/k8s-microservices-package-tracker.git'
    targetRevision: HEAD
    path: helm-chart
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
