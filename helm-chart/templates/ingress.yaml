{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: package-tracker-ingress
  labels:
    app.kubernetes.io/name: package-tracker-api
spec:
  ingressClassName: {{ .Values.api.ingress.className | quote }}
  rules:
    - host: {{ .Values.api.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  name: http
{{- end }}
