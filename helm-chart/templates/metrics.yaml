apiVersion: v1
kind: Service
metadata:
  name: package-tracker-metrics
  labels:
    app.kubernetes.io/name: package-tracker-api-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: package-tracker-api
  ports:
    - name: metrics
      port: {{ .Values.api.metrics.port }}
      targetPort: metrics
      protocol: TCP
---
{{- if .Values.api.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: package-tracker-api
  namespace: {{ .Values.api.metrics.serviceMonitor.namespace | quote }}
  labels:
    release: {{ .Values.api.metrics.serviceMonitor.releaseLabel | quote }}
    app.kubernetes.io/name: package-tracker-api
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/name: package-tracker-api-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
{{- end }}
