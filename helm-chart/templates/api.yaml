apiVersion: apps/v1
kind: Deployment
metadata:
  name: package-tracker-api
  labels:
    app.kubernetes.io/name: package-tracker-api
    app.kubernetes.io/instance: package-tracker
spec:
  replicas: {{ .Values.api.replicaCount }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: package-tracker-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: package-tracker-api
        app.kubernetes.io/instance: package-tracker
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-run-as-user: "1000"
        vault.hashicorp.com/agent-run-as-group: "1000"
        vault.hashicorp.com/agent-inject-perms-db-creds.json: "0440"
        vault.hashicorp.com/role: {{ .Values.api.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-{{ .Values.api.vault.secretFile }}: {{ .Values.api.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-{{ .Values.api.vault.secretFile }}: |
          {{`{{- with secret "`}}{{ .Values.api.vault.secretPath }}{{`" -}}`}}
          {"MONGO_URI": {{`{{ .Data.data.mongo_uri | toJSON }}`}}}
          {{`{{- end }}`}}
    spec:
      serviceAccountName: {{ .Values.api.serviceAccountName }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          env:
            - name: PORT
              value: "3000"
            - name: METRICS_PORT
              value: {{ .Values.api.metrics.port | quote }}
            - name: MONGO_URI_FILE
              value: {{ printf "/vault/secrets/%s" .Values.api.vault.secretFile | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.api.metrics.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  labels:
    app.kubernetes.io/name: package-tracker-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: package-tracker-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
